<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fashion Mela Khulna — Style For Every Budget</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500;1,600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ============ TOKENS ============ */
:root{
  --plum-950:#1B1214;
  --plum-900:#B31E28;
  --plum-800:#8F1620;
  --plum-700:#A81E28;
  --plum-500:#D9727C;
  --plum-300:#DDD0CD;
  --plum-100:#F5E1E1;
  --gold-600:#A9803D;
  --gold-500:#C6A15B;
  --gold-300:#EAD9AE;
  --cream-100:#FBF7F1;
  --cream-200:#F4EDE2;
  --ink-900:#201515;
  --ink-600:#5C4A47;
  --white:#FFFFFF;
  --shadow: 0 20px 45px -20px rgba(20,10,10,0.35);
  --radius-sm: 4px;
  --radius-md: 8px;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  font-family:'Jost', sans-serif;
  background:var(--cream-100);
  color:var(--ink-900);
  font-weight:400;
  -webkit-font-smoothing:antialiased;
}
img{max-width:100%;display:block;}
a{text-decoration:none;color:inherit;}
h1,h2,h3,h4{
  font-family:'Cormorant Garamond', serif;
  margin:0;
  font-weight:600;
  color:var(--plum-900);
}
p{margin:0;line-height:1.65;}
button{font-family:inherit;cursor:pointer;border:none;background:none;}
input,select,textarea{font-family:inherit;}
.eyebrow{
  font-family:'Jost',sans-serif;
  text-transform:uppercase;
  letter-spacing:0.22em;
  font-size:0.72rem;
  color:var(--gold-600);
  font-weight:500;
}
.container{
  max-width:1220px;
  margin:0 auto;
  padding:0 28px;
}
.btn{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:14px 30px;
  border-radius:2px;
  font-size:0.82rem;
  letter-spacing:0.1em;
  text-transform:uppercase;
  font-weight:500;
  transition:all .25s ease;
  white-space:nowrap;
}
.btn-primary{
  background:var(--plum-900);
  color:var(--cream-100);
}
.btn-primary:hover{background:var(--plum-700);}
.btn-gold{
  background:var(--gold-500);
  color:var(--plum-950);
}
.btn-gold:hover{background:var(--gold-600);}
.btn-outline{
  background:transparent;
  border:1px solid var(--plum-900);
  color:var(--plum-900);
}
.btn-outline:hover{background:var(--plum-900);color:var(--cream-100);}
.btn-ghost{
  background:transparent;
  color:var(--plum-900);
  padding:8px;
}

/* scallop divider (signature motif) */
.scallop{
  width:100%;
  height:14px;
  display:block;
  background-repeat:repeat-x;
  background-size:28px 14px;
  background-image: radial-gradient(circle at 14px 0px, transparent 12px, var(--gold-500) 13px, var(--gold-500) 13.5px, transparent 14px);
  opacity:0.8;
}
.scallop.flip{ transform:rotate(180deg); }

/* ============ ANNOUNCEMENT BAR ============ */
.announce{
  background:var(--plum-950);
  color:var(--plum-100);
  text-align:center;
  font-size:0.76rem;
  letter-spacing:0.06em;
  padding:9px 16px;
  font-weight:400;
}
.announce a{color:var(--gold-300);font-weight:500;}

/* ============ NAV ============ */
header.site-nav{
  position:sticky;top:0;z-index:200;
  background:rgba(251,247,241,0.96);
  backdrop-filter:blur(6px);
  border-bottom:1px solid rgba(107,78,142,0.15);
}
.nav-inner{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 28px;
  max-width:1220px;margin:0 auto;
  gap:20px;
}
.brand{
  display:flex;align-items:center;gap:10px;
}
.brand img{height:46px;width:auto;}
.brand-text{display:flex;flex-direction:column;line-height:1.1;}
.brand-text .name{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:1.4rem;color:var(--plum-900);}
.brand-text .tag{font-size:0.62rem;letter-spacing:0.14em;text-transform:uppercase;color:var(--gold-600);}
nav.main-links{
  display:flex;gap:30px;
  font-size:0.88rem;
  letter-spacing:0.02em;
}
nav.main-links a{
  position:relative;padding:6px 0;color:var(--ink-900);
  transition:color .2s;
}
nav.main-links a:hover{color:var(--plum-700);}
nav.main-links a::after{
  content:"";position:absolute;left:0;bottom:0;height:1px;width:0;background:var(--gold-500);
  transition:width .25s ease;
}
nav.main-links a:hover::after{width:100%;}
.nav-actions{display:flex;align-items:center;gap:6px;}
.icon-btn{
  position:relative;
  width:40px;height:40px;
  display:flex;align-items:center;justify-content:center;
  border-radius:50%;color:var(--plum-900);
  transition:background .2s;
}
.icon-btn:hover{background:var(--plum-100);}
.cart-count{
  position:absolute;top:2px;right:2px;
  background:var(--gold-500);color:var(--plum-950);
  font-size:0.62rem;font-weight:600;
  width:16px;height:16px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
}
.search-wrap{display:flex;align-items:center;border-bottom:1px solid var(--plum-300);padding:4px 2px;}
.search-wrap input{border:none;background:none;outline:none;font-size:0.85rem;width:130px;color:var(--ink-900);}
.hamburger{display:none;}

/* ============ HERO ============ */
.hero{
  position:relative;
  display:grid;
  grid-template-columns: 1.05fr 0.95fr;
  align-items:stretch;
  background:var(--plum-950);
  overflow:hidden;
}
.hero-copy{
  padding:80px 56px;
  display:flex;flex-direction:column;justify-content:center;
  gap:22px;
  color:var(--cream-100);
  position:relative;
  z-index:2;
}
.hero-copy .eyebrow{color:var(--gold-300);}
.hero-copy h1{
  font-size:3.4rem;
  color:var(--white);
  line-height:1.08;
  font-weight:600;
}
.hero-copy h1 em{
  font-style:italic;font-weight:500;color:var(--gold-300);
}
.hero-copy .sub{
  font-size:1rem;color:var(--plum-300);
  max-width:420px;
  font-family:'Jost',sans-serif;
}
.hero-ctas{display:flex;gap:14px;margin-top:6px;flex-wrap:wrap;}
.hero-frame{
  position:relative;
  overflow:hidden;
}
.hero-frame img{
  width:100%;height:100%;object-fit:cover;
  min-height:520px;
}
.hero-frame::before{
  content:"";
  position:absolute;inset:18px;
  border:1px solid rgba(230,205,150,0.55);
  pointer-events:none;
  z-index:3;
}
.hero-frame::after{
  content:"";
  position:absolute; inset:0;
  background:linear-gradient(90deg, rgba(42,21,51,0.35), transparent 35%);
  z-index:2;
}
.hero-corner{
  position:absolute;width:70px;height:70px;z-index:4;opacity:0.9;
}
.hero-corner.tl{top:8px;left:8px;transform:rotate(0deg);}
.hero-corner.br{bottom:8px;right:8px;transform:rotate(180deg);}

/* ============ CATEGORY STRIP ============ */
.cat-strip{padding:64px 0 44px;}
.section-head{
  text-align:center;margin-bottom:38px;
  display:flex;flex-direction:column;gap:8px;align-items:center;
}
.section-head h2{font-size:2.3rem;}
.section-head p{color:var(--ink-600);max-width:480px;font-size:0.92rem;}
.cat-grid{
  display:grid;grid-template-columns:repeat(4,1fr);gap:26px;
}
.cat-card{
  text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;
}
.cat-ring{
  width:130px;height:130px;border-radius:50%;
  padding:5px;
  background:conic-gradient(from 180deg, var(--gold-500), var(--plum-500), var(--gold-500));
  transition:transform .3s ease;
}
.cat-card:hover .cat-ring{transform:scale(1.05);}
.cat-ring-inner{
  width:100%;height:100%;border-radius:50%;overflow:hidden;
  border:4px solid var(--cream-100);
}
.cat-ring-inner img{width:100%;height:100%;object-fit:cover;}
.cat-card .cname{font-family:'Cormorant Garamond',serif;font-size:1.2rem;font-weight:600;color:var(--plum-900);}
.cat-card .ccount{font-size:0.72rem;color:var(--ink-600);letter-spacing:0.05em;text-transform:uppercase;}

/* ============ PRODUCTS ============ */
.shop{padding:20px 0 70px;}
.filter-row{
  display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:40px;
}
.filter-chip{
  padding:9px 20px;border:1px solid var(--plum-300);border-radius:30px;
  font-size:0.78rem;letter-spacing:0.05em;text-transform:uppercase;color:var(--plum-800);
  transition:all .2s;
}
.filter-chip.active,.filter-chip:hover{background:var(--plum-900);color:var(--cream-100);border-color:var(--plum-900);}
.product-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:30px;
}
.pcard{
  background:var(--white);
  position:relative;
  overflow:hidden;
  transition:box-shadow .3s ease, transform .3s ease;
}
.pcard:hover{box-shadow:var(--shadow);transform:translateY(-4px);}
.pcard .pimg-wrap{position:relative;overflow:hidden;aspect-ratio:3/4;background:var(--cream-200);}
.pcard .pimg-wrap img{width:100%;height:100%;object-fit:cover;transition:transform .5s ease;}
.pcard:hover .pimg-wrap img{transform:scale(1.06);}
.pcard .ptag{
  position:absolute;top:12px;left:12px;
  background:var(--plum-950);color:var(--gold-300);
  font-size:0.62rem;letter-spacing:0.08em;text-transform:uppercase;
  padding:5px 10px;
}
.quick-add{
  position:absolute;left:0;right:0;bottom:-100%;
  background:rgba(36,26,46,0.92);
  color:var(--cream-100);
  padding:12px;text-align:center;
  font-size:0.75rem;letter-spacing:0.1em;text-transform:uppercase;
  transition:bottom .3s ease;
}
.pcard:hover .quick-add{bottom:0;}
.pinfo{padding:18px 4px 6px;}
.pinfo .pcat{font-size:0.68rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--gold-600);}
.pinfo h3{font-size:1.18rem;margin-top:4px;font-weight:600;}
.pinfo .pdesc{font-size:0.8rem;color:var(--ink-600);margin-top:5px;}
.pinfo .prow{display:flex;align-items:center;justify-content:space-between;margin-top:12px;}
.pinfo .price{font-family:'Cormorant Garamond',serif;font-size:1.25rem;font-weight:600;color:var(--plum-900);}
.pinfo .price .orig{font-size:0.85rem;color:var(--ink-600);text-decoration:line-through;margin-left:6px;font-family:'Jost',sans-serif;}

/* ============ EDITORIAL BANNER ============ */
.editorial{
  position:relative;min-height:420px;display:flex;align-items:center;
  background-size:cover;background-position:center;
  margin:60px 0;
}
.editorial::before{
  content:"";position:absolute;inset:0;
  background:linear-gradient(90deg, rgba(42,21,51,0.82) 0%, rgba(42,21,51,0.35) 55%, rgba(42,21,51,0.05) 100%);
}
.editorial-copy{position:relative;z-index:2;max-width:480px;padding:0 60px;color:var(--cream-100);display:flex;flex-direction:column;gap:16px;}
.editorial-copy h2{color:var(--white);font-size:2.6rem;}
.editorial-copy p{color:var(--plum-300);font-size:0.95rem;}

/* ============ LIFESTYLE / ABOUT ============ */
.about-split{
  display:grid;grid-template-columns:1fr 1fr;gap:0;align-items:stretch;
  margin:80px 0;
}
.about-split img{width:100%;height:100%;object-fit:cover;min-height:460px;}
.about-copy{
  background:var(--plum-900);color:var(--cream-100);
  padding:70px 60px;display:flex;flex-direction:column;justify-content:center;gap:18px;
}
.about-copy .eyebrow{color:var(--gold-300);}
.about-copy h2{color:var(--white);font-size:2.4rem;}
.about-copy p{color:var(--plum-300);font-size:0.95rem;max-width:420px;}
.about-stats{display:flex;gap:36px;margin-top:14px;}
.about-stats div{display:flex;flex-direction:column;}
.about-stats strong{font-family:'Cormorant Garamond',serif;font-size:2rem;color:var(--gold-300);}
.about-stats span{font-size:0.7rem;letter-spacing:0.08em;text-transform:uppercase;color:var(--plum-300);}

/* ============ VALUE PROPS ============ */
.values{padding:20px 0 80px;}
.values-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:40px;}
.value-item{text-align:center;padding:0 20px;}
.value-icon{
  width:56px;height:56px;margin:0 auto 18px;
  border-radius:50%;background:var(--plum-100);
  display:flex;align-items:center;justify-content:center;color:var(--plum-700);
}
.value-item h4{font-size:1.25rem;margin-bottom:8px;}
.value-item p{font-size:0.85rem;color:var(--ink-600);}

/* ============ NEWSLETTER / WHATSAPP BAND ============ */
.cta-band{
  background:var(--plum-950);
  padding:56px 0;
  color:var(--cream-100);
}
.cta-inner{
  display:flex;align-items:center;justify-content:space-between;gap:30px;flex-wrap:wrap;
}
.cta-inner h3{color:var(--white);font-size:1.9rem;max-width:420px;}
.cta-inner p{color:var(--plum-300);font-size:0.85rem;margin-top:6px;}

/* ============ FOOTER ============ */
footer{background:var(--ink-900);color:var(--plum-300);padding:70px 0 0;}
.footer-grid{
  display:grid;grid-template-columns:1.4fr 1fr 1fr 1.2fr;gap:40px;padding-bottom:50px;
  border-bottom:1px solid rgba(196,174,216,0.15);
}
.footer-grid h5{
  color:var(--gold-300);font-size:0.75rem;letter-spacing:0.12em;text-transform:uppercase;margin-bottom:18px;font-family:'Jost',sans-serif;font-weight:600;
}
.footer-grid ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px;}
.footer-grid ul a{font-size:0.87rem;color:var(--plum-300);transition:color .2s;}
.footer-grid ul a:hover{color:var(--gold-300);}
.footer-brand img{height:44px;margin-bottom:14px;}
.footer-brand p{font-size:0.85rem;color:var(--plum-300);max-width:280px;margin-bottom:16px;}
.footer-contact{font-size:0.85rem;display:flex;flex-direction:column;gap:8px;}
.footer-contact span{color:var(--cream-100);}
.socials{display:flex;gap:12px;margin-top:18px;}
.socials a{
  width:34px;height:34px;border-radius:50%;border:1px solid rgba(196,174,216,0.3);
  display:flex;align-items:center;justify-content:center;font-size:0.8rem;
  transition:all .2s;
}
.socials a:hover{background:var(--gold-500);color:var(--ink-900);border-color:var(--gold-500);}
.footer-bottom{
  display:flex;justify-content:space-between;align-items:center;padding:22px 0;font-size:0.75rem;color:var(--plum-500);flex-wrap:wrap;gap:10px;
}

/* ============ WHATSAPP FLOAT ============ */
.wa-float{
  position:fixed;bottom:26px;right:26px;z-index:300;
  width:58px;height:58px;border-radius:50%;
  background:#25D366;color:white;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 10px 25px rgba(0,0,0,0.25);
  transition:transform .2s;
}
.wa-float:hover{transform:scale(1.08);}

/* ============ MODALS / OVERLAY ============ */
.overlay{
  position:fixed;inset:0;background:rgba(36,26,46,0.55);
  z-index:400;display:none;align-items:center;justify-content:center;padding:20px;
}
.overlay.show{display:flex;}
.modal{
  background:var(--cream-100);width:100%;max-width:420px;
  padding:40px 36px;position:relative;
  box-shadow:0 30px 60px rgba(0,0,0,0.3);
}
.modal-close{position:absolute;top:14px;right:14px;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink-600);}
.modal-close:hover{background:var(--plum-100);}
.modal h3{font-size:1.7rem;text-align:center;margin-bottom:6px;}
.modal .sub{text-align:center;color:var(--ink-600);font-size:0.82rem;margin-bottom:26px;}
.tabs{display:flex;border-bottom:1px solid var(--plum-300);margin-bottom:26px;}
.tab{flex:1;text-align:center;padding:10px 0;font-size:0.85rem;letter-spacing:0.05em;color:var(--ink-600);border-bottom:2px solid transparent;}
.tab.active{color:var(--plum-900);border-color:var(--gold-500);font-weight:500;}
.form-group{margin-bottom:16px;}
.form-group label{display:block;font-size:0.72rem;letter-spacing:0.06em;text-transform:uppercase;color:var(--ink-600);margin-bottom:6px;}
.form-group input{
  width:100%;padding:12px 14px;border:1px solid var(--plum-300);background:var(--white);
  font-size:0.9rem;outline:none;transition:border-color .2s;
}
.form-group input:focus{border-color:var(--plum-700);}
.form-msg{font-size:0.78rem;text-align:center;margin-top:10px;min-height:18px;}
.form-msg.error{color:#B23A48;}
.form-msg.success{color:#3E7C4A;}
.pane{display:none;}
.pane.active{display:block;}
.user-chip{display:flex;align-items:center;gap:14px;background:var(--plum-100);padding:16px;margin-bottom:18px;}
.user-avatar{width:44px;height:44px;border-radius:50%;background:var(--plum-700);color:white;display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-size:1.2rem;}

/* ============ CART DRAWER ============ */
.drawer-overlay{
  position:fixed;inset:0;background:rgba(36,26,46,0.5);z-index:400;
  display:none;
}
.drawer-overlay.show{display:block;}
.drawer{
  position:fixed;top:0;right:-440px;width:100%;max-width:440px;height:100%;
  background:var(--cream-100);z-index:401;
  display:flex;flex-direction:column;
  transition:right .35s ease;
  box-shadow:-10px 0 40px rgba(0,0,0,0.2);
}
.drawer.show{right:0;}
.drawer-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:22px 26px;border-bottom:1px solid var(--plum-300);
}
.drawer-head h3{font-size:1.4rem;}
.drawer-body{flex:1;overflow-y:auto;padding:20px 26px;}
.cart-item{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid rgba(139,107,168,0.15);}
.cart-item img{width:72px;height:90px;object-fit:cover;}
.ci-info{flex:1;display:flex;flex-direction:column;gap:6px;}
.ci-info .ciname{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:1.05rem;}
.ci-info .cicat{font-size:0.68rem;text-transform:uppercase;letter-spacing:0.06em;color:var(--gold-600);}
.qty-row{display:flex;align-items:center;gap:10px;margin-top:4px;}
.qty-btn{width:24px;height:24px;border:1px solid var(--plum-300);display:flex;align-items:center;justify-content:center;font-size:0.85rem;}
.ci-remove{font-size:0.72rem;color:var(--ink-600);text-decoration:underline;align-self:flex-start;margin-top:2px;}
.ci-price{font-family:'Cormorant Garamond',serif;font-weight:600;white-space:nowrap;}
.empty-cart{text-align:center;padding:60px 10px;color:var(--ink-600);}
.drawer-foot{border-top:1px solid var(--plum-300);padding:20px 26px 26px;}
.sub-row{display:flex;justify-content:space-between;font-size:0.95rem;margin-bottom:16px;}
.sub-row strong{font-family:'Cormorant Garamond',serif;font-size:1.3rem;color:var(--plum-900);}
.checkout-form{display:none;flex-direction:column;gap:12px;margin-top:12px;}
.checkout-form.show{display:flex;}

/* ============ TOAST ============ */
.toast{
  position:fixed;bottom:100px;right:26px;z-index:500;
  background:var(--plum-950);color:var(--cream-100);
  padding:14px 22px;font-size:0.85rem;
  opacity:0;transform:translateY(10px);
  transition:all .3s ease;pointer-events:none;
  display:flex;align-items:center;gap:10px;
}
.toast.show{opacity:1;transform:translateY(0);}

/* ============ RESPONSIVE ============ */
@media (max-width:980px){
  .hero{grid-template-columns:1fr;}
  .hero-frame img{min-height:340px;}
  .hero-copy{padding:56px 32px;}
  .hero-copy h1{font-size:2.5rem;}
  .cat-grid{grid-template-columns:repeat(2,1fr);}
  .about-split{grid-template-columns:1fr;}
  .about-split img{min-height:280px;}
  .values-grid{grid-template-columns:1fr;gap:34px;}
  .footer-grid{grid-template-columns:1fr 1fr;}
  nav.main-links{display:none;}
  .hamburger{display:flex;}
  .search-wrap{display:none;}
}
@media (max-width:560px){
  .cat-grid{grid-template-columns:repeat(2,1fr);gap:16px;}
  .cat-ring{width:100px;height:100px;}
  .editorial-copy{padding:0 30px;}
  .editorial-copy h2{font-size:2rem;}
  .footer-grid{grid-template-columns:1fr;}
  .cta-inner{flex-direction:column;text-align:center;}
}
